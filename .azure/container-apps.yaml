## Azure Container Apps deployment manifest for cvDoctor backend.
## Deploy with: az containerapp create --yaml .azure/container-apps.yaml
##
## Pre-requisites:
##   1. ACR image pushed: az acr build --registry <acr-name> --image cvdoctor-api:latest .
##   2. Key Vault secrets created (see secretRef values below).
##   3. Managed Identity granted Key Vault Secrets User role.

properties:
  managedEnvironmentId: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RG>/providers/Microsoft.App/managedEnvironments/<ENV_NAME>

  configuration:
    ingress:
      external: true
      targetPort: 8000
      transport: http
      corsPolicy:
        allowedOrigins:
          - "https://<your-frontend-domain>"
        allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        allowedHeaders: ["*"]
        allowCredentials: true

    secrets:
      - name: anthropic-api-key
        keyVaultUrl: https://<KEYVAULT_NAME>.vault.azure.net/secrets/ANTHROPIC-API-KEY
        identity: system
      - name: openai-api-key
        keyVaultUrl: https://<KEYVAULT_NAME>.vault.azure.net/secrets/OPENAI-API-KEY
        identity: system
      - name: supabase-url
        keyVaultUrl: https://<KEYVAULT_NAME>.vault.azure.net/secrets/SUPABASE-URL
        identity: system
      - name: supabase-key
        keyVaultUrl: https://<KEYVAULT_NAME>.vault.azure.net/secrets/SUPABASE-KEY
        identity: system
      - name: supabase-jwt-secret
        keyVaultUrl: https://<KEYVAULT_NAME>.vault.azure.net/secrets/SUPABASE-JWT-SECRET
        identity: system

  template:
    containers:
      - name: cvdoctor-api
        image: <ACR_NAME>.azurecr.io/cvdoctor-api:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: ANTHROPIC_API_KEY
            secretRef: anthropic-api-key
          - name: OPENAI_API_KEY
            secretRef: openai-api-key
          - name: SUPABASE_URL
            secretRef: supabase-url
          - name: SUPABASE_KEY
            secretRef: supabase-key
          - name: SUPABASE_JWT_SECRET
            secretRef: supabase-jwt-secret

    scale:
      minReplicas: 1
      maxReplicas: 5
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "20"

  identity:
    type: SystemAssigned
